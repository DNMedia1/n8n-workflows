services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: vapi-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
      - N8N_RUNNERS_ENABLED=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - SLACK_STEINOFENBOT_WEBHOOK_URL=${SLACK_STEINOFENBOT_WEBHOOK_URL:-}
      - SLACK_ORDERS_WEBHOOK_URL=${SLACK_ORDERS_WEBHOOK_URL:-${SLACK_WEBHOOK_URL:-}}
      - SLACK_ORDERS_CHANNEL=${SLACK_ORDERS_CHANNEL:-#test-channel-steinofen-bot}
      - MENU_PDF_URL=${MENU_PDF_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-${OPENAI_API_KEY:-}}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
